name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check changed lines for whitespace errors
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'pull_request') {
            git diff --check "origin/${{ github.base_ref }}...HEAD"
          } elseif ('${{ github.event_name }}' -eq 'push') {
            # A push can contain multiple commits. HEAD^ only checks the last one.
            $before = '${{ github.event.before }}'
            if ($before -match '^0{40}
          if ($LASTEXITCODE -ne 0) {
            throw "git diff --check found whitespace errors."
          }

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: .NET info
        run: dotnet --info

      # Exercise the same Full test entry used by local developers.
      # It must include Core, Audio, and WPF; a WPF failure must fail CI.
      - name: Full managed regression tests (Core, Audio, WPF)
        shell: pwsh
        run: ./test-all.ps1

      - name: Configure native renderer tests
        run: cmake -S src/ExtremeEditor.NativeRenderer -B artifacts/native-ci -A x64

      - name: Build native renderer tests
        run: cmake --build artifacts/native-ci --config Release --parallel

      - name: Native renderer tests
        run: ctest --test-dir artifacts/native-ci -C Release --output-on-failure

      - name: Build WPF app
        run: dotnet build src/ExtremeEditor.Wpf/ExtremeEditor.Wpf.csproj -c Release --nologo

      - name: Publish portable Windows x64 app
        run: >
          dotnet publish src/ExtremeEditor.Wpf/ExtremeEditor.Wpf.csproj
          -c Release
          -r win-x64
          --self-contained false
          -o artifacts/publish/win-x64
          --nologo

      - name: Verify portable app contents
        shell: pwsh
        run: |
          $output = 'artifacts/publish/win-x64'
          $required = @(
            'ExtremeEditor.Wpf.exe',
            'ExtremeEditor.Wpf.dll',
            'ExtremeEditor.NativeRenderer.dll',
            'AssetExtractor/ExtremeEditor.AssetExtractor.dll'
          )
          foreach ($file in $required) {
            $full = Join-Path $output $file
            if (-not (Test-Path -LiteralPath $full -PathType Leaf)) {
              throw "Missing portable app dependency: $full"
            }
          }

      - name: Upload portable Windows x64 app
        uses: actions/upload-artifact@v4
        with:
          name: ExtremeEditor-win-x64
          path: artifacts/publish/win-x64/
          if-no-files-found: error
          retention-days: 7
) {
              # A new branch has no previous ref; compare its changes to main.
              git diff --check "origin/${{ github.event.repository.default_branch }}...HEAD"
            } else {
              git diff --check $before HEAD
            }
          } else {
            # Manual dispatch has no push event's before SHA.
            git diff --check HEAD^ HEAD
          }
          if ($LASTEXITCODE -ne 0) {
            throw "git diff --check found whitespace errors."
          }

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: .NET info
        run: dotnet --info

      # Exercise the same Full test entry used by local developers.
      # It must include Core, Audio, and WPF; a WPF failure must fail CI.
      - name: Full managed regression tests (Core, Audio, WPF)
        shell: pwsh
        run: ./test-all.ps1

      - name: Configure native renderer tests
        run: cmake -S src/ExtremeEditor.NativeRenderer -B artifacts/native-ci -A x64

      - name: Build native renderer tests
        run: cmake --build artifacts/native-ci --config Release --parallel

      - name: Native renderer tests
        run: ctest --test-dir artifacts/native-ci -C Release --output-on-failure

      - name: Build WPF app
        run: dotnet build src/ExtremeEditor.Wpf/ExtremeEditor.Wpf.csproj -c Release --nologo

      - name: Publish portable Windows x64 app
        run: >
          dotnet publish src/ExtremeEditor.Wpf/ExtremeEditor.Wpf.csproj
          -c Release
          -r win-x64
          --self-contained false
          -o artifacts/publish/win-x64
          --nologo

      - name: Verify portable app contents
        shell: pwsh
        run: |
          $output = 'artifacts/publish/win-x64'
          $required = @(
            'ExtremeEditor.Wpf.exe',
            'ExtremeEditor.Wpf.dll',
            'ExtremeEditor.NativeRenderer.dll',
            'AssetExtractor/ExtremeEditor.AssetExtractor.dll'
          )
          foreach ($file in $required) {
            $full = Join-Path $output $file
            if (-not (Test-Path -LiteralPath $full -PathType Leaf)) {
              throw "Missing portable app dependency: $full"
            }
          }

      - name: Upload portable Windows x64 app
        uses: actions/upload-artifact@v4
        with:
          name: ExtremeEditor-win-x64
          path: artifacts/publish/win-x64/
          if-no-files-found: error
          retention-days: 7
